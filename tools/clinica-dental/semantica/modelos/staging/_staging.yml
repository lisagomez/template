# GENERADO desde el contrato de eventos v1 por semantica/genera.ts: no se edita a mano.
version: 2
models:
  - name: stg_portal_visitado
    description: Eventos «portal_visitado» del libro, tipados.
    columns:
      - name: evento_id
        data_tests: [unique, not_null]
      - name: sujeto
        data_tests: [not_null]
      - name: canal_adquisicion
        data_tests: [not_null, {accepted_values: {arguments: {values: ['busqueda', 'redes', 'referido', 'convenio', 'directo']}}}]
