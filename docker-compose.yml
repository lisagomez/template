# =============================================================================
# Stack de produccion self-hosted (Hetzner Cloud u otro VPS).
# Caddy termina TLS (certificado automatico) y hace proxy a Next.js.
# Solo Caddy publica puertos; la app NO es alcanzable desde internet.
#
# NADA de aqui asume un modelo de servidor concreto: el nombre de la imagen y los
# limites salen de `.env.production`, y los calcula `npm run configura:deploy`
# midiendo la maquina donde corre. Los defaults arrancan en un servidor pequeño.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build args, no environment: NEXT_PUBLIC_* se inlinea en build.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?falta en .env.production}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?falta en .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?falta en .env.production}
        # Lo calcula scripts/configura-deploy.mjs midiendo el servidor real.
        NODE_HEAP_MB: ${NODE_HEAP_MB:-2048}
    image: ${APP_NAME:-saas-factory-app}:${APP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Secretos server-side (service_role, API keys) van aqui: se leen en
      # runtime y NO se inlinean en el bundle del navegador.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    deploy:
      resources:
        limits:
          # Derivados del servidor real por scripts/configura-deploy.mjs. Los defaults
          # son de servidor pequeño: mejor arrancar apretado que morir por OOM.
          cpus: "${APP_CPUS:-1.5}"
          memory: ${APP_MEM:-2G}
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN en .env.production}
      TLS_EMAIL: ${TLS_EMAIL:?falta TLS_EMAIL en .env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisten los certificados: sin esto Let's Encrypt te banea por
      # rate limit tras unos cuantos redeploys.
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPUS:-0.5}"
          memory: ${CADDY_MEM:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
