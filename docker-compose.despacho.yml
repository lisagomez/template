# =============================================================================
# Stack del DESPACHO CONTABLE (spec 015, piloto del buzón de CFDI recibidos).
#
# Corre entero en la máquina del despacho y ningún documento sale de ella (RF-6, RF-7):
#   · `frente` e `interna` son redes SIN salida a internet (internal: true). Todo lo que toca
#     un documento vive solo en ellas: app, ocr y el Supabase autohospedado.
#   · Caddy es el ÚNICO servicio con salida (TLS de Let's Encrypt) y el único que publica
#     puertos. Lleva el dominio como alias en `frente`: la app llega a https://$DOMAIN sin salir.
#
# Supabase autohospedado, recortado a lo que el piloto usa: db, auth, rest y storage. Fuera a
# propósito: studio, realtime, functions, analytics, vector, supavisor, imgproxy y la pasarela
# (Caddy enruta /auth/v1, /rest/v1 y /storage/v1, ver despacho/Caddyfile). Configuración tomada
# de supabase/supabase@3fc8af3 (docker/).
#
# Archivo aparte, no un perfil: el despliegue normal (docker-compose.yml) da salida a la app, y
# aquí el perímetro tiene que leerse entero en un solo sitio. Lo vigila `npm run prueba:buzon`.
#
# Imágenes pineadas por digest: cambiar un pineo es un CDC (C1).
#
#   node scripts/despacho/llaves.mjs                 # secretos del despacho, una sola vez
#   npm run configura:deploy -- --escribir           # con DESPLIEGUE=despacho en .env.production
#   docker compose -f docker-compose.despacho.yml --env-file .env.production up -d
# =============================================================================

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      - app
      - auth
      - rest
      - storage
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN en .env.production}
      TLS_EMAIL: ${TLS_EMAIL:?falta TLS_EMAIL en .env.production}
    volumes:
      - ./despacho/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPUS:-0.5}"
          memory: ${CADDY_MEM:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      web: {}
      frente:
        aliases:
          - ${DOMAIN:?falta DOMAIN en .env.production}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Mismo origen que la app: el navegador habla con un solo dominio (RF-6).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?falta en .env.production}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?falta en .env.production}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?falta en .env.production}
        NODE_HEAP_MB: ${NODE_HEAP_MB:-2048}
    image: ${APP_NAME:-saas-factory-app}-despacho:${APP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      # Sin SUPABASE_SERVICE_ROLE_KEY ni llaves de modelos: la app del despacho no salta RLS (C7)
      # y no tiene a quién llamar fuera.
      EXTRACTOR_SERVICIO_URL: http://ocr:8080
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-1.5}"
          memory: ${APP_MEM:-2G}
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frente
      - interna

  ocr:
    build:
      context: ./tools/extractor-documental
      dockerfile: servicio/Dockerfile
    image: ${APP_NAME:-saas-factory-app}-ocr:${APP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      EXTRACTOR_EN_VUELO: ${OCR_EN_VUELO:-2}
      EXTRACTOR_PROYECTO: ${OCR_PROYECTO:-/extractor/servicio/proyecto-ejemplo.json}
      # FIJO, no configurable: en el despacho no hay cola de visión fuera de su máquina (RF-7).
      EXTRACTOR_RESPALDO: ninguno
    tmpfs:
      - /tmp/extractor:uid=1001,gid=1001,mode=700
    deploy:
      resources:
        limits:
          cpus: "${OCR_CPUS:-2}"
          memory: ${OCR_MEM:-2G}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - interna

  # ---- Supabase autohospedado -------------------------------------------------
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    volumes:
      - ./despacho/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./despacho/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db_data:/var/lib/postgresql/data
      - db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD (corre scripts/despacho/llaves.mjs)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD (corre scripts/despacho/llaves.mjs)}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    deploy:
      resources:
        limits:
          memory: ${DB_MEM:-1G}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - interna

  auth:
    image: supabase/gotrue:v2.196.0@sha256:c0c25187a6b835e65a6f6e6c6b39d090e832d40e6de5186f2c038e0411944232
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://${DOMAIN}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Las cuentas del despacho las da de alta el operador: nadie se registra solo.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET (corre scripts/despacho/llaves.mjs)}
      GOTRUE_JWT_ISSUER: https://${DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Sin SMTP: no hay salida a internet. El alta confirma sin correo.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    deploy:
      resources:
        limits:
          memory: ${AUTH_MEM:-256M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frente
      - interna

  rest:
    image: postgrest/postgrest:v14.17@sha256:c9dc201e555f5d8e37e7f39cdd4df0229774996e213bfd7de8d10ac609030f2c
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    deploy:
      resources:
        limits:
          memory: ${REST_MEM:-256M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frente
      - interna

  storage:
    image: supabase/storage-api:v1.74.0@sha256:f1546fac6d1c7e345428ac904bfaa7be7cecd50a1f549fe1cf38c628a7b15c85
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?falta SERVICE_ROLE_KEY (corre scripts/despacho/llaves.mjs)}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: https://${DOMAIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: despacho
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: despacho
      REGION: local
      # Sin imgproxy: el piloto no transforma imágenes.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage_data:/var/lib/storage
    deploy:
      resources:
        limits:
          memory: ${STORAGE_MEM:-512M}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frente
      - interna

volumes:
  caddy_data:
  caddy_config:
  db_data:
  db_config:
  storage_data:

networks:
  web:
    driver: bridge
  frente:
    driver: bridge
    internal: true
  interna:
    driver: bridge
    internal: true
